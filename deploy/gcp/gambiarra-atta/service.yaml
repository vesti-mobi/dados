# Cloud Run service do GambiarraAtta (antes: Vercel). Painel estatico servido por nginx.
# Aplicado pelo workflow .github/workflows/deploy-gcp.yml com
#   gcloud run services replace deploy/gcp/gambiarra-atta/service.yaml --region southamerica-east1
# IMAGE_PLACEHOLDER e trocado pela imagem do commit no momento do deploy.
# Os headers e regras do GambiarraAtta/vercel.json estao em deploy/gcp/gambiarra-atta/nginx.conf.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gambiarra-atta
  labels:
    app: gambiarra-atta
    migrado-de: vercel
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        app: gambiarra-atta
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # SA sem nenhum papel: o nginx nao acessa nada do GCP.
      serviceAccountName: paineis-estaticos@vesti-data-499015.iam.gserviceaccount.com
      timeoutSeconds: 30
      containerConcurrency: 200
      containers:
        - image: IMAGE_PLACEHOLDER
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
  traffic:
    - latestRevision: true
      percent: 100
