# Cloud Run service do vesti-cs-tier (antes: projeto vesti-cs-tier na Vercel,
# publicado com `npx vercel --prod` a partir de CS/api-tier/).
# Aplicado pelo workflow .github/workflows/deploy-gcp.yml com
#   gcloud run services replace deploy/gcp/vesti-cs-tier/service.yaml --region southamerica-east1
# IMAGE_PLACEHOLDER e trocado pela imagem do commit no momento do deploy.
#
# Armazenamento: o Vercel Blob virou o bucket gs://vesti-data-cs-tier
# (TIER_BUCKET). A copia do estado atual e feita uma vez pelo bootstrap.sh.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: vesti-cs-tier
  labels:
    app: vesti-cs-tier
    migrado-de: vercel
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        app: vesti-cs-tier
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: vesti-cs-tier@vesti-data-499015.iam.gserviceaccount.com
      timeoutSeconds: 30
      containerConcurrency: 20
      containers:
        - image: IMAGE_PLACEHOLDER
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          env:
            - name: TIER_BUCKET
              value: vesti-data-cs-tier
            - name: SENHA_PAINEL
              valueFrom:
                secretKeyRef:
                  name: vesti-cs-tier-senha-painel
                  key: latest
  traffic:
    - latestRevision: true
      percent: 100
