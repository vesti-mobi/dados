# Reproduz o painel-tribo/vercel.json:
#   cleanUrls: true  -> /x.html redireciona (308) para /x; /x serve x.html
#   Cache-Control de dados.js (sempre revalida) e d3.v7.min.js (1 ano, imutavel)
# Demais arquivos: o padrao da Vercel para estatico (public, max-age=0, must-revalidate).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    etag on;

    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    location = /index.html { return 308 /$is_args$args; }
    location = /index      { return 308 /$is_args$args; }
    location ~ ^/(.+)\.html$ { return 308 /$1$is_args$args; }

    location = /dados.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /d3.v7.min.js {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
