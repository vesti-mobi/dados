# Painel da Tribo (MDATA-503) — carga diária.
#
# Regenera painel-tribo/dados.js a partir do BigQuery e das planilhas do time,
# e commita o resultado. O painel é estático: a Vercel publica o que está no
# repositório, então o commit é o deploy.
#
# Fontes, todas lidas a cada execução:
#   BigQuery  GMV, GMV integração, GMV Oráculo, TPV, receita de antifraude,
#             análises do antifraude e CSAT do VestiPago (dataset huggy)
#   Sheets    CSAT e resposta de Integrações e Plataforma, tempo de análise
#             e chargeback perdido
#   HubSpot   SLA das três equipes, pipeline Suporte
#
# Secrets:
#   GCP_SA_KEY              conta de serviço do BigQuery (já usada por outros
#                           workflows deste repositório)
#   PAINEL_TRIBO_SHEETS_SA  conta de serviço com acesso às planilhas
#                           (painel-cs-sheets-reader@csatenps)
#   HUBSPOT_TOKEN           token privado do HubSpot, para o SLA

# ATRASO DO SCHEDULER DO GITHUB
# O GitHub entrega os eventos `schedule` DIARIOS deste repositorio com 5 a 7h
# de atraso, todo dia (medido em 27/10/2026: este workflow pediu 05:00 BRT e
# rodou 05:03 BRT (ainda pontual em 28/10, mas os outros tambem comecaram assim)). `created_at == run_started_at`: o evento nasce tarde, nao
# e fila de runner. E best-effort do lado do GitHub, sem correcao possivel
# aqui. Crons HORARIOS atrasam pouco (5-59 min) mas o GitHub descarta boa
# parte deles. Ver tambem o comentario em update-starkbank.yml.
#
# GATILHO PRINCIPAL (desde 28/10/2026): um job do Cloud Scheduler no projeto
# GCP vesti-data-499015 crava 05:00 BRT e chama
#   POST https://api.github.com/repos/vesti-mobi/dados/dispatches
#   {"event_type":"painel-tribo-update"}
#   gcloud scheduler jobs list --location=southamerica-east1 --project=vesti-data-499015
#
# Os crons `schedule` abaixo ficam como REDE DE SEGURANCA pra quando o
# Scheduler falhar (PAT expirado, por exemplo). Eles pedem disparos de 15 em
# 15 min numa faixa larga; quem decide e o job `guard`, pela hora REAL de
# chegada — nunca pela hora agendada.

name: Painel da Tribo

on:
  schedule:
    - cron: '*/15 7-11 * * *'   # cobre a janela das 05:00 BRT
  repository_dispatch:
    types: [painel-tribo-update]
  workflow_dispatch:
    inputs:
      desde:
        description: 'Data inicial (vazio = 2025-01-01, obrigatório para a comparação anual)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: painel-tribo
  cancel-in-progress: false

jobs:
  # Decide se o trabalho deve rodar. Barato: ~10s quando a resposta e nao.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Esta na janela e ainda nao rodou neste turno?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          WF: painel-tribo.yml
          JOB_TRABALHO: atualizar
          # Janelas de execucao em minutos desde 00:00 BRT (05:00-08:59).
          JANELAS: '300-539'
          # Horas de silencio exigidas depois de um trabalho real, pra dois
          # disparos do mesmo turno nao rodarem o job duas vezes.
          COOLDOWN_H: '6'
        run: |
          # Tres origens, tres regras:
          #
          #   workflow_dispatch   — eu, na mao, pela UI. Roda sempre.
          #   repository_dispatch — o Cloud Scheduler no horario certo. Ignora
          #                         a janela (o horario dele JA e o certo) mas
          #                         respeita o cooldown, pra nao duplicar o
          #                         trabalho num dia em que um cron do GitHub
          #                         tenha chegado antes dele.
          #   schedule            — os crons do GitHub, rede de seguranca.
          #                         Janela + cooldown.
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "Disparo manual: roda sem checar."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENTO" = "schedule" ]; then
            MIN=$(( $(TZ=America/Sao_Paulo date +%-H) * 60 + $(TZ=America/Sao_Paulo date +%-M) ))
            DENTRO=0
            for F in $JANELAS; do
              if [ "$MIN" -ge "${F%%-*}" ] && [ "$MIN" -le "${F#*-}" ]; then DENTRO=1; fi
            done
            if [ "$DENTRO" -eq 0 ]; then
              echo "Agora sao $(TZ=America/Sao_Paulo date +%H:%M) BRT — fora das janelas. Nada a fazer."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Quando foi o ultimo TRABALHO de verdade? Nao da pra olhar so a
          # conclusao do run: um run em que o guard deu skip tambem termina
          # como success, e usar isso como marcador se auto-envenenaria (o
          # skip da 01h bloquearia o trabalho das 04h). Entao procuramos o
          # run mais recente em que o job '$JOB_TRABALHO' concluiu com
          # sucesso — ele so existe quando o guard liberou.
          ULTIMO=""
          for ID in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?status=success&per_page=30" \
                        --jq '.workflow_runs[].id' 2>/dev/null | head -12); do
            OK=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ID}/jobs" \
                   --jq "[.jobs[] | select(.name==\"${JOB_TRABALHO}\" and .conclusion==\"success\")] | length" 2>/dev/null || echo 0)
            if [ "${OK:-0}" -gt 0 ]; then
              ULTIMO=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ID}" --jq '.created_at' 2>/dev/null || true)
              break
            fi
          done
          if [ -z "$ULTIMO" ]; then
            # Fail-open: sem historico confiavel, preferimos rodar a deixar o
            # painel sem atualizar.
            echo "Nao achei nenhum run com '$JOB_TRABALHO' bem-sucedido nos ultimos 12 — roda por seguranca."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          H=$(( ( $(date -u +%s) - $(date -u -d "$ULTIMO" +%s) ) / 3600 ))
          echo "Ultimo '$JOB_TRABALHO' bem-sucedido: $ULTIMO (ha ${H}h) | cooldown ${COOLDOWN_H}h"
          if [ "$H" -lt "$COOLDOWN_H" ]; then
            echo "Ja rodou neste turno. Nada a fazer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Turno novo — seguindo."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  atualizar:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Gravar credencial do BigQuery
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp_sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp_sa.json" >> "$GITHUB_ENV"

      - name: Gravar credencial das planilhas
        env:
          SHEETS_SA: ${{ secrets.PAINEL_TRIBO_SHEETS_SA }}
        run: |
          printf '%s' "$SHEETS_SA" > "$RUNNER_TEMP/sheets_sa.json"
          echo "GOOGLE_SHEETS_SA_JSON_FILE=$RUNNER_TEMP/sheets_sa.json" >> "$GITHUB_ENV"

      - name: Gerar dados.js
        working-directory: painel-tribo
        env:
          DESDE: ${{ inputs.desde }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node build_data.js

      - name: Conferir que o arquivo saiu sadio
        working-directory: painel-tribo
        run: |
          node -e '
            global.window = {};
            require("./dados.js");
            const d = window.DADOS_TRIBO;
            const linhas = d.diario.length;
            const gmv = d.diario.reduce((a, r) => a + (r.gmv || 0), 0);
            if (linhas < 600) throw new Error("serie curta demais: " + linhas + " linhas");
            if (!(gmv > 0)) throw new Error("GMV zerado");
            console.log("ok: " + linhas + " linhas | GMV R$ " + (gmv / 1e6).toFixed(1) + " mi | ate " + d.periodo.fim);
          '

      - name: Commitar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- painel-tribo/dados.js; then
            echo "dados.js sem mudanca; nada a commitar."
            exit 0
          fi
          git add painel-tribo/dados.js
          git commit -m "auto: atualiza o Painel da Tribo ($(date -u '+%d/%m/%Y %H:%M') UTC)"
          git push
