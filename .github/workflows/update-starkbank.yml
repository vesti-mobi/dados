name: Atualizar Relatorio StarkBank VestiPago

# ATRASO DO SCHEDULER DO GITHUB (constatado 31/08/2026, re-medido 28/10/2026)
# O GitHub entrega os eventos `schedule` DIARIOS deste repositorio com 5 a 7h
# de atraso, todo dia. Nao e so aqui: em 27/10 o bdr-bigquery (cron 03:00 BRT)
# rodou 08:39, o painel-elisa (08:00 BRT) rodou 13:16 e este (04:10 BRT) rodou
# 10:08. `created_at == run_started_at` em todos: o evento nasce tarde, nao e
# fila de runner. E comportamento best-effort do lado do GitHub, sem correcao
# possivel aqui.
#
# O QUE MUDA O JOGO: crons HORARIOS atrasam pouco — o atualizar-saldos
# ('7 * * * *') chega com 5 a 59 min de atraso. Em troca, o GitHub DESCARTA
# varios disparos (27/10 entregou 8 das 24 horas). Entao a estrategia e:
#   1. pedir disparos a cada 15 min na faixa que antecede a janela desejada;
#   2. o job `guard` decide pela hora REAL de chegada, nao pela agendada:
#      so executa entre 04:00 e 07:59 BRT (madrugada + um fallback de manha
#      cedo) e so se o relatorio de hoje ainda nao foi gerado;
#   3. fora dessa faixa, ou se o dia ja foi feito, o guard sai em ~10s —
#      repo publico, minutos de Actions ilimitados, custo zero;
#   4. `concurrency` pra dois disparos nunca rodarem em paralelo;
#
# GATILHO PRINCIPAL (desde 28/10/2026): um job do Cloud Scheduler no projeto
# GCP vesti-data-499015 crava 04:00 America/Sao_Paulo e chama
#   POST /repos/vesti-mobi/dados/dispatches  {"event_type":"starkbank-update"}
# Ele ignora a janela horaria do guard (o horario dele ja e o certo) mas
# respeita a checagem do dia. Os crons `schedule` acima ficam como rede de
# seguranca pra quando o Scheduler falhar.
#   gcloud scheduler jobs list --location=<regiao> --project=vesti-data-499015

on:
  schedule:
    # Faixa 02:00-08:59 BRT agendada (05:00-11:59 UTC), a cada 15 min. Com o
    # atraso tipico de 5-59 min, as chegadas cobrem com folga a janela de
    # execucao 04:00-07:59 BRT que o `guard` aplica.
    - cron: '*/15 5-11 * * *'
  repository_dispatch:
    types: [starkbank-update]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do disparo manual'
        required: false
        default: 'manual'
      somente_fabric:
        description: 'Modo rapido: atualiza so o CP (API orders-paylinks, ~4min). Pula o CR/Faturas (~22min). (nome historico)'
        type: boolean
        required: false
        default: false

# Um run por vez. Sem isso, um cron de fallback disparando enquanto o
# principal (atrasado) ainda roda geraria trabalho duplicado e disputa de
# push. Enfileirado, o fallback so comeca depois — e ai o `guard` ja ve o
# invoices.js de hoje e sai limpo.
concurrency:
  group: update-starkbank
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: O relatorio completo de hoje ja foi gerado?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          # Tres origens, tres regras:
          #
          #   workflow_dispatch   — eu, na mao, pela UI. Roda sempre, sem
          #                         checar nada: quem pediu, pediu.
          #   repository_dispatch — o Cloud Scheduler cravando 04:00 BRT.
          #                         Ignora a janela horaria (o horario dele JA
          #                         e o certo), mas respeita a checagem do dia
          #                         — senao, num dia em que um cron do GitHub
          #                         chegasse antes dele, rodariamos o job
          #                         completo (~25min) duas vezes.
          #   schedule            — os crons do GitHub, rede de seguranca pra
          #                         quando o Scheduler falhar. Janela horaria
          #                         + checagem do dia.
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "Disparo manual: roda sem checar."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENTO" = "schedule" ]; then
            # Janela de execucao: 04:00-07:59 BRT. O cron pede disparos de 15
            # em 15 min porque o GitHub atrasa e descarta boa parte deles; quem
            # manda e a hora REAL de chegada. Depois das 08:00 o dia nao
            # atualiza mais — e o pedido explicito: uma atualizacao de
            # madrugada, com um unico fallback de manha cedo, nunca de tarde.
            # 10# evita base octal.
            H=$(TZ=America/Sao_Paulo date +%H)
            if [ "$((10#$H))" -lt 4 ] || [ "$((10#$H))" -ge 8 ]; then
              echo "Agora sao ${H}h BRT — fora da janela 04:00-07:59. Nada a fazer."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # invoices.js (CR) so e commitado quando o run completo roda, entao
          # a data do ultimo commit dele e o marcador confiavel do dia.
          ULTIMO=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=relatoriostarkbank/invoices.js&per_page=1" \
                     --jq '.[0].commit.committer.date // empty' || true)
          if [ -z "$ULTIMO" ]; then
            echo "Nao consegui ler o ultimo commit do invoices.js; roda por seguranca."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOJE=$(TZ=America/Sao_Paulo date +%F)
          DIA=$(TZ=America/Sao_Paulo date -d "$ULTIMO" +%F)
          echo "Ultimo invoices.js: $ULTIMO (BRT $DIA) | hoje BRT: $HOJE"
          if [ "$DIA" = "$HOJE" ]; then
            echo "Relatorio de hoje ja esta no repo — nada a fazer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Relatorio de hoje ainda nao rodou — seguindo."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar ODBC Driver 18 for SQL Server
        run: |
          . /etc/os-release
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -sSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev

      - name: Instalar dependencias Python
        run: pip install pyodbc google-cloud-bigquery google-auth

      - name: Gravar credencial BigQuery (SA key)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp_sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp_sa.json" >> "$GITHUB_ENV"

      - name: Rodar fetcher StarkBank (CP - API Vesti)
        # CP agora vem da API Vesti (orders-paylinks, payment.receivables
        # completo) — NAO mais do espelho Fabric, que vinha em ~46% do real.
        # continue-on-error: se a API do CP falhar, nao deve abortar o job; o CR
        # e o commit ainda rodam (dados.js so fica como esta).
        continue-on-error: true
        working-directory: relatoriostarkbank
        env:
          VESTI_ORDER_TOKEN: ${{ secrets.VESTI_ORDER_TOKEN }}
        run: python fetch_data.py

      - name: Rodar fetcher Faturas (API Vesti)
        # Etapa lenta (~22min) que pagina todas as marcas na API Vesti e
        # sobrecarrega o banco de producao. Roda 1x por dia: qualquer um dos
        # crons pode ser o do dia, e o job `guard` garante que so o primeiro
        # a chegar faca o trabalho. So e pulada no modo rapido (somente_fabric).
        # Quando roda, deixa o marcador .cr_updated pro passo de commit saber
        # que deve incluir o invoices.js.
        if: ${{ github.event.inputs.somente_fabric != 'true' }}
        working-directory: relatoriostarkbank
        env:
          VESTIAPI_TOKEN: ${{ secrets.VESTIAPI_TOKEN }}
        run: |
          python fetch_invoices.py
          touch "$GITHUB_WORKSPACE/.cr_updated"

      - name: Corrigir nomes de marca no dados.js (CP)
        # O CP (fetch_data.py) resolve o nome da marca lendo o invoices.js que
        # JA estava no repo, e roda ANTES do fetch_invoices.py. Marca cujo
        # primeiro pedido Starkbank e recente ainda nao esta nesse invoices.js
        # antigo e sai com nomeFantasia="" — o painel entao mostra o companyId
        # cru (index.html faz `nomeFantasia || companyId`). Caso: Sisal Jeans
        # em 28/07/2026. Aqui, com o invoices.js ja atualizado, reaplicamos os
        # nomes. Nao aborta o job: e cosmetico, o proximo run resolveria.
        continue-on-error: true
        working-directory: relatoriostarkbank
        run: python patch_nomes.py

      # (removido) "Reconciliar antecipacao real": era um remendo da era Fabric
      # pra corrigir a classificacao Fluxo/Antecipacao. Agora o CP ja vem da API
      # com antecipationValue por parcela, e o build() classifica direto
      # (antecipationValue > 0 = antecipado). enrich_antecipacao_real.py fica no
      # repo como referencia, mas nao roda mais no workflow.

      - name: Rodar fetcher Cancelados (BigQuery)
        # Fonte migrada do Fabric pro BQ em 19/08/2026: a capacidade Fabric esta
        # pausada desde ~15/07 e esta etapa gastava ~13min por run em 6
        # tentativas so pra falhar (continue-on-error deixava o run verde e
        # ninguem percebia que o cancelados_valores.js estava congelado).
        # No BQ a mesma consulta responde em ~1,3s. continue-on-error segue
        # valendo: cancelados nao deve abortar o commit do dados.js.
        continue-on-error: true
        working-directory: relatoriostarkbank
        run: python fetch_cancelados.py

      - name: Commit e push se houver mudancas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Arquivos gerados sao regeracoes completas. So incluimos o invoices.js
          # (CR) quando o fetcher da API rodou de fato (marcador .cr_updated) —
          # senao (modo rapido) estariamos re-adicionando uma copia possivelmente
          # defasada e revertendo o update diario concorrente.
          if [ -f .cr_updated ]; then
            FILES="relatoriostarkbank/dados.js relatoriostarkbank/invoices.js relatoriostarkbank/cancelados_valores.js"
          else
            FILES="relatoriostarkbank/dados.js relatoriostarkbank/cancelados_valores.js"
          fi
          MSG="Atualizacao StarkBank $(date +'%d/%m/%Y %H:%M')"
          # Sem rebase: reaplica nossos arquivos recem-gerados sobre o topo do remoto.
          # Evita conflitos de merge em arquivos regenerados quando dois runs colidem.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            # reset MIXED: index volta pro topo do remoto (preserva mudancas
            # concorrentes em outros arquivos); working tree intacto com nossos
            # arquivos gerados, que re-adicionamos a seguir.
            git reset -q origin/main
            git add $FILES 2>/dev/null || true
            if git diff --cached --quiet; then echo "sem mudancas"; exit 0; fi
            git commit -q -m "$MSG"
            if git push; then echo "push ok (tentativa $i)"; exit 0; fi
            echo "push falhou (tentativa $i), re-sincronizando..."
            sleep 3
          done
          echo "push falhou apos varias tentativas"; exit 1
