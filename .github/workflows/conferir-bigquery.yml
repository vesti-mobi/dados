# Cópia local do workflow que roda no vesti-mobi/dados.
#
# Conferência sob demanda: refaz em SQL, do zero, o GMV e o TPV do VestiPago
# por CS e mês, e compara com o que está publicado no CS/dados.js. Não escreve
# nada — o resultado sai no log da execução.
#
# O log deste repositório é público, então o script imprime o VEREDITO ("=" ou
# a diferença), não os valores. VERBOSE=1 mostra os números.
#
# Rodar: aba Actions -> "Conferir BigQuery" -> Run workflow (dá para escolher
# meses e carteiras). Usa o secret GCP_SA_KEY, o mesmo da carga diária.

name: Conferir BigQuery

on:
  workflow_dispatch:
    inputs:
      meses:
        description: 'Meses, separados por vírgula (vazio = out/nov/dez de 2025)'
        required: false
        default: ''
      cs:
        description: 'Carteiras, separadas por vírgula (vazio = Gabriella, Thamiris, Luana)'
        required: false
        default: ''
      verbose:
        description: 'Mostrar os valores no log (o log é público)'
        required: false
        default: '0'
      modo:
        description: 'conferir (padrão), explorar, gmv, pbi ou mensalidades (esqueleto da planilha de mensalidades)'
        required: false
        default: 'conferir'

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias Node
        run: npm install --no-audit --no-fund

      - name: Gravar credencial BigQuery (SA key)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp_sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp_sa.json" >> "$GITHUB_ENV"

      - name: Conferir painel × BigQuery
        if: inputs.modo != 'explorar' && inputs.modo != 'mensalidades'
        working-directory: CS
        env:
          MESES: ${{ inputs.meses }}
          CS: ${{ inputs.cs }}
          VERBOSE: ${{ inputs.verbose }}
        run: node conferir_bigquery.js

      # Só olha o catálogo do dataset: que tabelas existem, quais têm coluna de
      # anjo/CS e quais têm cara de histórico. Nenhum dado de cliente no log.
      - name: Explorar o lake
        if: inputs.modo == 'explorar'
        working-directory: CS
        run: node explorar_carteira.js

      # Reproduz a medida "GMV Total" do relatório do Power BI (v1 + v2) para
      # achar qual coluna é o "Status = 1" dele e quanto a soma duplica.
      - name: Conferir a medida do Power BI
        if: inputs.modo == 'pbi'
        working-directory: CS
        env:
          MES: ${{ inputs.meses }}
        run: node conferir_pbi.js

      # Só olha o ESQUELETO da planilha de mensalidades: abas, cabeçalhos e
      # contagem de linhas. Nenhum nome de marca, nenhum valor, nenhum e-mail
      # de service account — o log deste repositório é público.
      - name: Explorar a planilha de mensalidades
        if: inputs.modo == 'mensalidades'
        working-directory: CS
        run: |
          pip install --quiet openpyxl google-auth
          python explorar_mensalidades.py

      # Mede o GMV do mês em todas as réguas possíveis (pago x criado, com teto
      # x sem, carteira x base toda) para achar de onde sai cada número.
      - name: Diagnóstico do GMV
        if: inputs.modo == 'gmv'
        working-directory: CS
        env:
          MES: ${{ inputs.meses }}
        run: node diagnostico_gmv.js
